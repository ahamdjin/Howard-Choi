name: Site build and prerender

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify lawyer-first SEO wording
        run: node scripts/check-lawyer-seo.mjs
      - name: Build and prerender routes
        run: NODE_ENV=development npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Smoke test production homepage hydration in Chrome
        run: |
          set -euo pipefail
          PORT=3000 node .output/server/index.mjs >/tmp/injury-site-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/injury-site-smoke.log | tail -30' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Local production server failed to become ready" >&2
            exit 1
          fi
          timeout 95s node scripts/smoke-homepage-browser.mjs
