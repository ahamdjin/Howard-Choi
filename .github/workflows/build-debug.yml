name: Build Debug

on:
  push:
    branches:
      - feature/homepage-design-gallery-v3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run build and capture output
        id: app_build
        continue-on-error: true
        run: |
          npm run build > build-debug.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Post build log to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Temporary build diagnostic output:'
            echo
            echo '```text'
            tail -n 180 build-debug.log
            echo '```'
          } > comment.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(cat comment.txt)"
      - name: Fail when build failed
        if: steps.app_build.outputs.exit_code != '0'
        run: exit 1
